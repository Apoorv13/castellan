name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  TORCH_VERSION: "2.15.0"

jobs:
  test:
    # The published results came from Python 3.12 (baselines, gate) and 3.14
    # (probe-v1, M3); test both. Tests are offline and CPU only. Presidio tests
    # skip here because the en_core_web_lg model (about 400 MB) is not installed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tgz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tgz" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install package (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[torch,data,dev]"

      - name: Regenerate eval sets and verify frozen hashes
        run: python scripts/eval_data.py

      - name: Run tests
        run: python -m pytest

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (repo config, history)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tgz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tgz" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
