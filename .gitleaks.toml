# Gitleaks config for this repo: the default rules, plus one path allowlist.
#
# Why: CASTELLAN is a secret detector, and its frozen eval sets are full of
# SYNTHETIC secrets on purpose (fake keys, tokens, JWTs, PEM blocks and DB URLs
# with valid-looking structure). Gitleaks is one of the baselines we compare
# against, so it flags thousands of them. None is a real credential: every value
# is generated by the deterministic generators in eval_data/ (see
# LICENSE-DATA.md and eval_data/README.md).
#
# The allowlist is kept narrow on purpose:
#   - eval_data/ holds the frozen generators (secrets_eval.py, ladder.py,
#     ladder_neutral.py), their JSONL outputs (gitignored here, but present after
#     scripts/eval_data.py runs, and in older history) and the freeze manifests.
#   - Everything else is scanned with the default rules. The few known synthetic
#     or harmless hits outside eval_data/ (test fixtures, a data hash, PEM header
#     constants) are suppressed one by one, by fingerprint, in .gitleaksignore,
#     so a real secret added anywhere else still fails the scan.

title = "castellan"

[extend]
useDefault = true

[[allowlists]]
description = "Frozen eval sets and their generators: synthetic secrets by design"
paths = [
  '''^eval_data/''',
]
